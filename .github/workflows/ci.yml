name: SentinelGRC CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install runtime dependencies
        run: python -m pip install --require-hashes --requirement requirements-hashed.txt

      - name: Verify production image closure policy
        run: python -m unittest test_production_image_closure -v

      - name: Run unit tests
        shell: pwsh
        run: |
          $unitModules = Get-ChildItem -File -Filter "test_*.py" |
            Where-Object { $_.Name -notlike "test_postgres*.py" } |
            ForEach-Object { $_.BaseName }
          if (-not $unitModules) {
            throw "No unit test modules were discovered"
          }
          python -m unittest -v @unitModules

      - name: Run offline staging assurance
        run: >-
          python -m scripts.staging_assurance
          --policy config/staging-assurance.example.json
          --alerts docs/evidence/staging-readiness/logwatcher-security-alert.v1.jsonl

      - name: Collect hermetic load and soak baseline
        if: always()
        run: >-
          python -m scripts.collect_load_soak_evidence
          --source-commit "${{ github.sha }}"
          --unique-findings 80
          --replay-rounds 1
          --concurrency 4
          --duration-seconds 1

      - name: Retain hermetic load and soak evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: load-soak-${{ github.run_id }}-${{ github.run_attempt }}
          path: runtime/staging-assurance/load-soak-evidence.json
          if-no-files-found: error
          retention-days: 14
      - name: Parse PowerShell agents
        shell: pwsh
        run: |
          $paths = @(
            "$PWD/agent/Export-SecurityPosture.ps1",
            "$PWD/agent/Export-ADAccessReview.ps1"
          )
          foreach ($path in $paths) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $path,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | Format-List
              exit 1
            }
          }

      - name: Check repository hygiene
        shell: pwsh
        run: |
          $forbidden = git ls-files | Where-Object { $_ -match '(^|/)(runtime|evidence-inbox)/|\.env($|\.)|\.db($|[-.])|\.db-(shm|wal)$|\.lock$' }
          if ($forbidden) {
            $forbidden | ForEach-Object { Write-Error "Forbidden runtime artifact tracked: $_" }
            exit 1
          }

  container-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        env:
          POSTGRES_DB: sentinel_test
          POSTGRES_USER: sentinel
          POSTGRES_PASSWORD: sentinel-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sentinel -d sentinel_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install PostgreSQL test dependencies
        run: python -m pip install --require-hashes --requirement requirements-hashed.txt

      - name: Run PostgreSQL integration tests
        env:
          SENTINEL_TEST_POSTGRES_URL: postgresql://sentinel:sentinel-test-only@127.0.0.1:5432/sentinel_test
        run: python -m unittest discover -v -p "test_postgres*.py"

      - name: Compile Azure staging Bicep
        run: |
          docker run --rm \
            --mount "type=bind,source=$PWD,target=/src,readonly" \
            --entrypoint /bin/sh \
            mcr.microsoft.com/azure-cli@sha256:23b520868509add054d385d90dc3fc5268f10a2f58947a994e30babe938e31ae \
            -c "az bicep install --version v0.45.15 && az bicep build --file /src/infra/azure/main.bicep --outfile /tmp/main.json"

      - name: Build runtime image once
        run: |
          docker buildx build --load \
            --iidfile /tmp/sentinelgrc-runtime.id \
            --tag sentinelgrc:${{ github.sha }} .

      - name: Build isolated assurance image
        run: |
          docker buildx build --load \
            --file Dockerfile.assurance \
            --build-arg RUNTIME_IMAGE=sentinelgrc:${{ github.sha }} \
            --tag sentinelgrc-assurance:${{ github.sha }} .

      - name: Verify runtime and assurance import boundaries
        run: |
          docker run --rm --entrypoint python sentinelgrc:${{ github.sha }} -c \
            "import importlib.util, pathlib, runtime_app; assert importlib.util.find_spec('staging_assurance') is None; assert not pathlib.Path('/app/scripts/azure_staging_validator.py').exists()"
          docker run --rm --entrypoint python sentinelgrc-assurance:${{ github.sha }} -c \
            "import scripts.azure_staging_validator"

      - name: Reject unreachable PostgreSQL at application construction
        run: |
          set +e
          timeout 20s docker run --rm --entrypoint python \
            -e SENTINEL_ENV=lab \
            -e SENTINEL_DATABASE_URL=postgresql://sentinel:sentinel-test-only@127.0.0.1:1/unreachable \
            -e SENTINEL_IDENTITY_DATABASE_URL=postgresql://sentinel:sentinel-test-only@127.0.0.1:1/unreachable \
            sentinelgrc:${{ github.sha }} \
            -c "from runtime_app import create_application; create_application()"
          exit_code=$?
          set -e
          test "$exit_code" -ne 0

      - name: Start PostgreSQL-backed runtime as non-root
        run: |
          docker run --detach --rm \
            --name sentinelgrc-smoke \
            --network host \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --tmpfs /app/runtime:rw,noexec,nosuid,uid=10001,gid=10001,mode=0700,size=64m \
            --security-opt no-new-privileges \
            --cap-drop ALL \
            -e SENTINEL_ENV=lab \
            -e SENTINEL_DATABASE_URL=postgresql://sentinel:sentinel-test-only@127.0.0.1:5432/sentinel_test \
            -e SENTINEL_IDENTITY_DATABASE_URL=postgresql://sentinel:sentinel-test-only@127.0.0.1:5432/sentinel_test \
            sentinelgrc:${{ github.sha }}

      - name: Verify positive PostgreSQL readiness
        run: |
          for attempt in $(seq 1 20); do
            if curl --fail --silent --max-time 5 http://127.0.0.1:8080/healthz >/tmp/health.json &&
               curl --fail --silent --max-time 10 http://127.0.0.1:8080/ready >/tmp/ready.json &&
               jq -e '.status == "ready" and .checks.governance_store == true and .checks.identity_store == true' /tmp/ready.json; then
              exit 0
            fi
            sleep 1
          done
          docker logs sentinelgrc-smoke
          exit 1

      - name: Verify dependency-loss readiness is fail closed
        run: |
          docker stop "${{ job.services.postgres.id }}"
          curl --fail --silent --max-time 5 http://127.0.0.1:8080/healthz >/tmp/health-after-db-loss.json
          status=$(curl --silent --max-time 15 --output /tmp/ready-after-db-loss.json --write-out '%{http_code}' http://127.0.0.1:8080/ready)
          test "$status" = "503"
          jq -e '.status == "not_ready" and .checks.governance_store == false and .checks.identity_store == false' /tmp/ready-after-db-loss.json
      - name: Verify PostgreSQL dependency recovery
        run: |
          docker start "${{ job.services.postgres.id }}"
          for attempt in $(seq 1 30); do
            if docker exec "${{ job.services.postgres.id }}" pg_isready -U sentinel -d sentinel_test >/dev/null 2>&1; then
              recovered_status=$(curl --silent --max-time 10 --output /tmp/ready-after-db-recovery.json --write-out '%{http_code}' http://127.0.0.1:8080/ready)
              if test "$recovered_status" = "200" && jq -e '.status == "ready" and .checks.governance_store == true and .checks.identity_store == true' /tmp/ready-after-db-recovery.json; then
                break
              fi
            fi
            sleep 1
          done
          test "$recovered_status" = "200"
          mkdir -p runtime/staging-assurance
          jq -n \
            --arg initial_status "$(jq -r '.status' /tmp/ready.json)" \
            --arg loss_status "$(jq -r '.status' /tmp/ready-after-db-loss.json)" \
            --arg recovered_status "$(jq -r '.status' /tmp/ready-after-db-recovery.json)" \
            '{
              schema_version: "sentinel.hermetic_postgres_readiness.v1",
              initial_http_status: 200,
              loss_http_status: 503,
              recovered_http_status: 200,
              initial_status: $initial_status,
              loss_status: $loss_status,
              recovered_status: $recovered_status,
              sqlite_fallback_observed: false
            }' >runtime/staging-assurance/postgres-readiness.json

      - name: Collect hermetic failure and recovery evidence
        run: >-
          python -m scripts.collect_hermetic_recovery_evidence
          --source-commit "${{ github.sha }}"
          --readiness runtime/staging-assurance/postgres-readiness.json

      - name: Retain hermetic recovery evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hermetic-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: runtime/staging-assurance/hermetic-recovery-evidence.json
          if-no-files-found: error
          retention-days: 14

      - name: Verify production startup remains explicitly blocked
        run: |
          set +e
          output=$(docker run --rm --entrypoint python \
            -e SENTINEL_ENV=production \
            -e SENTINEL_DATABASE_URL=postgresql://sentinel:sentinel-test-only@127.0.0.1:1/blocked \
            -e SENTINEL_IDENTITY_DATABASE_URL=postgresql://sentinel:sentinel-test-only@127.0.0.1:1/blocked \
            -e SENTINEL_OIDC_ISSUER=https://login.microsoftonline.com/00000000-0000-0000-0000-000000000001/v2.0 \
            -e SENTINEL_OIDC_AUDIENCE=00000000-0000-0000-0000-000000000002 \
            -e SENTINEL_OIDC_TENANT_ID=00000000-0000-0000-0000-000000000001 \
            -e SENTINEL_OIDC_JWKS_URL=https://login.microsoftonline.com/00000000-0000-0000-0000-000000000001/discovery/v2.0/keys \
            -e SENTINEL_EVIDENCE_STORE_URL=https://example.blob.core.windows.net/evidence \
            -e SENTINEL_AUDIT_ARCHIVE_URL=https://example.blob.core.windows.net/audit \
            -e SENTINEL_AZURE_CLIENT_ID=00000000-0000-0000-0000-000000000003 \
            -e SENTINEL_SERVICE_BUS_NAMESPACE=sentinel-ci.servicebus.windows.net \
            -e SENTINEL_SERVICE_BUS_QUEUE=governance-events \
            -e SENTINEL_REQUIRE_TLS=true \
            sentinelgrc:${{ github.sha }} \
            -c "from runtime_app import create_application; create_application()" 2>&1)
          exit_code=$?
          set -e
          test "$exit_code" -ne 0
          grep -F "production startup is blocked" <<<"$output"

      - name: Stop runtime
        if: always()
        run: docker stop sentinelgrc-smoke || true

  security-assessment:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Audit hash-locked dependencies
        id: pip_audit
        continue-on-error: true
        uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266
        with:
          inputs: requirements-hashed.txt
          require-hashes: true
          no-deps: true
      - name: Collect pre-live security assessment
        if: always() && steps.pip_audit.outcome != 'skipped'
        env:
          DEPENDENCY_REPORT_BASE64: ${{ steps.pip_audit.outputs['internal-be-careful-output'] }}
          DEPENDENCY_SCAN_OUTCOME: ${{ steps.pip_audit.outcome }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: >-
          python -m scripts.collect_security_assessment
          --source-commit "$SOURCE_COMMIT"
          --dependency-scan-outcome "$DEPENDENCY_SCAN_OUTCOME"
          --dependency-report-base64 "$DEPENDENCY_REPORT_BASE64"
      - name: Retain pre-live security assessment
        if: always() && steps.pip_audit.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: security-assessment-${{ github.run_id }}-${{ github.run_attempt }}
          path: runtime/staging-assurance/security-assessment-evidence.json
          if-no-files-found: error
          retention-days: 30

