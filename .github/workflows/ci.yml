name: SentinelGRC CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run unit tests
        run: python -m unittest discover -v -p "test_*.py"

      - name: Parse PowerShell agents
        shell: pwsh
        run: |
          $paths = @(
            "$PWD/agent/Export-SecurityPosture.ps1",
            "$PWD/agent/Export-ADAccessReview.ps1"
          )
          foreach ($path in $paths) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $path,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | Format-List
              exit 1
            }
          }

      - name: Check repository hygiene
        shell: pwsh
        run: |
          $forbidden = git ls-files | Where-Object { $_ -match '(^|/)(runtime|evidence-inbox)/|\.env($|\.)|\.db($|[-.])|\.db-(shm|wal)$|\.lock$' }
          if ($forbidden) {
            $forbidden | ForEach-Object { Write-Error "Forbidden runtime artifact tracked: $_" }
            exit 1
          }
