name: SentinelGRC CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run unit tests
        run: python -m unittest discover -v -p "test_*.py"

      - name: Parse PowerShell agents
        shell: pwsh
        run: |
          $paths = @(
            "$PWD/agent/Export-SecurityPosture.ps1",
            "$PWD/agent/Export-ADAccessReview.ps1"
          )
          foreach ($path in $paths) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $path,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | Format-List
              exit 1
            }
          }

      - name: Check repository hygiene
        shell: pwsh
        run: |
          $forbidden = git ls-files | Where-Object { $_ -match '(^|/)(runtime|evidence-inbox)/|\.env($|\.)|\.db($|[-.])|\.db-(shm|wal)$|\.lock$' }
          if ($forbidden) {
            $forbidden | ForEach-Object { Write-Error "Forbidden runtime artifact tracked: $_" }
            exit 1
          }

  container-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        env:
          POSTGRES_DB: sentinel_test
          POSTGRES_USER: sentinel
          POSTGRES_PASSWORD: sentinel-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sentinel -d sentinel_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PostgreSQL test dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Run PostgreSQL integration tests
        env:
          SENTINEL_TEST_POSTGRES_URL: postgresql://sentinel:sentinel-test-only@127.0.0.1:5432/sentinel_test
        run: python -m unittest -v test_postgres_integration.py

      - name: Build runtime image
        run: docker build --tag sentinelgrc:${{ github.sha }} .

      - name: Start runtime as non-root
        run: |
          docker run --detach --rm \
            --name sentinelgrc-smoke \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --mount type=tmpfs,destination=/app/runtime,tmpfs-size=67108864,tmpfs-mode=1777 \
            --security-opt no-new-privileges \
            --cap-drop ALL \
            --publish 127.0.0.1:18080:8080 \
            sentinelgrc:${{ github.sha }}

      - name: Verify liveness and readiness
        run: |
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:18080/healthz >/tmp/health.json &&
               curl --fail --silent http://127.0.0.1:18080/ready >/tmp/ready.json; then
              cat /tmp/health.json
              cat /tmp/ready.json
              exit 0
            fi
            sleep 1
          done
          docker logs sentinelgrc-smoke
          exit 1

      - name: Stop runtime
        if: always()
        run: docker stop sentinelgrc-smoke || true
